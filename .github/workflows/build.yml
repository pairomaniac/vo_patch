name: "Build"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # vo-patch.py carries the assembled bytes rather than assembling on demand,
  # so the assembly and the blobs in the script can drift apart and everything
  # will still look fine: the repository is self-consistent and the shipped
  # patcher installs last week's code. This job is the only thing that
  # notices. It runs on every push, not just on a tag, because by tag time the
  # bad blob is already what people download.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          nasm -v

      - run: pip install pyflakes

      # Imports the module, so the patch table checks run: lengths, bounds,
      # cross-patch collisions, and the one intra-patch overlap the XInput
      # routine relies on.
      - name: Patch tables
        run: python3 vo-patch.py --selfcheck

      # Reassembles asm/*.asm, repacks the tables and dialogs from asm/*.py,
      # and compares the lot against the committed blobs. Also checks each
      # blob's site in the patch table against the address the source names
      # for it, which is the one mistake nothing downstream would notice.
      # Writes nothing - nasm works in a temporary directory.
      - name: Sources match the committed blobs
        run: python3 asm/build.py --check

      # The netplay DLL is compiled, not assembled, and two mingw versions
      # do not produce identical bytes from identical source. So the blob
      # records a hash of net/dpctrl.c and this compares against it: it
      # answers "was the blob built from this source", which is the drift
      # that matters, without demanding a reproducible toolchain.
      - name: Netplay blob matches its source
        run: python3 net/build.py --check

      # Separately, prove the C still builds and still exports what the
      # game imports. Nothing here compares against the committed blob.
      - name: Netplay DLL compiles
        run: |
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
          i686-w64-mingw32-gcc -O2 -shared -o /tmp/dpctrl.dll \
              net/dpctrl.c net/dpctrl.def -lws2_32 -lwinmm \
              -Wl,--enable-stdcall-fixup
          for sym in InitialDirectPlay DestroyDirectPlay SendDirectPlay \
                     SendDirectPlayWaitMessage ReceiveDirectPlay \
                     SWDataSendReceive CloseProvider; do
            i686-w64-mingw32-objdump -p /tmp/dpctrl.dll | grep -q "$sym" \
              || { echo "missing export: $sym"; exit 1; }
          done
          i686-w64-mingw32-objdump -p /tmp/dpctrl.dll | grep -i 'DLL Name'
          i686-w64-mingw32-objdump -p /tmp/dpctrl.dll | grep -qi dplayx \
            && { echo "still linked against DirectPlay"; exit 1; }
          echo "ok"

      # --check is meant to be read-only. If that ever stops being true this
      # catches it, and it also catches a blob regenerated but not committed.
      - name: Working tree is clean
        run: git diff --exit-code

      - name: Lint
        run: python3 -m pyflakes vo-patch.py asm/*.py net/build.py tools/selftest.py

      # What this job cannot do is apply the patches to a real v_on.exe: the
      # game is not in the repository. Run tools/selftest.py by hand before
      # tagging - it is the only check that catches a wrong offset.

  # Builds on every push to main, on a tag, and on demand from the Actions
  # tab. Pull requests are left out: the push that follows the merge builds
  # the same tree, and PyInstaller takes minutes.
  #
  # A push build is an artifact and nothing else - only a tag reaches the
  # release page. Artifacts keep for 90 days, so the last few commits are
  # always downloadable without tagging anything.
  windows:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # certifi is not imported unless the platform trust store fails, but it
      # has to be installed here or there is nothing to fall back to in the
      # exe. The bundle check below is what notices if it goes missing.
      - run: pip install pyinstaller==6.21.0 certifi

      # The source carries no version. A tag build takes it from the tag, so
      # the tag and the filename cannot disagree; anything else takes the
      # short SHA, so a downloaded artifact says which commit built it.
      # Everything downstream - the spec, the exe name, the Windows file
      # properties, the window title, --version - reads this one line.
      - name: Stamp the version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          python - "$version" <<'EOF'
          import pathlib, re, sys
          src = pathlib.Path('vo-patch.py')
          text, n = re.subn(r"^VERSION = '.*'$", "VERSION = '%s'" % sys.argv[1],
                            src.read_text(encoding='utf-8'), count=1, flags=re.M)
          if n != 1:
              raise SystemExit('no VERSION line in vo-patch.py')
          src.write_text(text, encoding='utf-8', newline='\n')
          EOF
          grep '^VERSION = ' vo-patch.py

      # Everything about the build lives in vo-patch.spec, including the
      # version, which it reads out of the script.
      - run: pyinstaller vo-patch.spec --noconfirm

      # A frozen build fails at import time or not at all, so check the
      # bundle: no tkinter and the exe is dead on arrival.
      - name: Inspect the bundle
        shell: bash
        run: |
          ls -l dist/
          pyi-archive_viewer -l -b dist/*.exe > listing.txt
          grep -q '_tkinter' listing.txt || { echo 'tkinter was not bundled'; exit 1; }
          grep -q 'pyi_rth__tkinter' listing.txt || { echo 'no Tk runtime hook'; exit 1; }
          grep -q 'cacert.pem' listing.txt || { echo 'certifi CA list was not bundled'; exit 1; }
          echo "$(grep -c . listing.txt) entries, tkinter and CA list present"

      # The listing cannot see inside the PYZ, so an over-eager entry in
      # EXCLUDES looks fine there and dies at the exe's own import line -
      # which is how a build shipped with email excluded and urllib.request
      # importing it. Running it is the only test that catches that.
      # --selfcheck needs neither a display nor a copy of the game.
      #
      # The exe is windowed: on a crash it puts up a dialog and waits for
      # someone to click it, so the timeout is what makes that a failed step
      # instead of a hung job.
      - name: The exe starts
        shell: bash
        run: |
          timeout 60 dist/vo-patch-*.exe --selfcheck
          echo 'the exe runs and its tables check out'

      # To the log, not an asset: a checksum beside its own binary proves
      # nothing.
      - name: Checksum
        shell: bash
        run: cd dist && sha256sum *.exe

      # Linux users run the script, so ship it too. Strip CR or the shebang
      # breaks when it is run directly.
      - name: Stage the script
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, re
          src = pathlib.Path('vo-patch.py')
          text = src.read_bytes().replace(b'\r\n', b'\n')
          version = re.search(rb"^VERSION = '(.*)'$", text, re.M).group(1).decode()
          pathlib.Path('dist/vo-patch-%s.py' % version).write_bytes(text)
          print('staged vo-patch-%s.py' % version)
          EOF
          if grep -q $'\r' dist/vo-patch-*.py; then
            echo 'a CR survived - ./vo-patch.py would not run on Linux'
            exit 1
          fi
          ls -l dist/

      # Tagged builds carry the tag, everything else the short SHA, so a
      # folder of downloads says which commit each one came from.
      - name: Name the artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "artifact=vo-patch-$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "artifact=vo-patch-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: |
            dist/*.exe
            dist/*.py

      # gh is preinstalled on the runner, so no third party action is needed
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.exe dist/*.py --clobber
