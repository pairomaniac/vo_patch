name: "Windows Build"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyinstaller==6.21.0

      # The exe is named from the script, so a mismatched tag ships the
      # wrong filename under the right release.
      - name: Tag matches the script version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -oP '(?<=^Version )\S+' vo-patch.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but the script says $version"
            exit 1
          fi
          echo "tag and script agree on $version"

      # Everything about the build lives in vo-patch.spec, including the
      # version, which it reads out of the script.
      - run: pyinstaller vo-patch.spec --noconfirm

      # A frozen build fails at import time or not at all, so check the
      # bundle: no tkinter and the exe is dead on arrival.
      - name: Inspect the bundle
        shell: bash
        run: |
          ls -l dist/
          pyi-archive_viewer -l -b dist/*.exe > listing.txt
          grep -q '_tkinter' listing.txt || { echo 'tkinter was not bundled'; exit 1; }
          grep -q 'pyi_rth__tkinter' listing.txt || { echo 'no Tk runtime hook'; exit 1; }
          if grep -q 'gi/' listing.txt; then echo 'gi leaked into the bundle'; exit 1; fi
          echo "$(grep -c . listing.txt) entries, tkinter present, gi absent"

      # To the log, not an asset: a checksum beside its own binary proves
      # nothing.
      - name: Checksum
        shell: bash
        run: cd dist && sha256sum *.exe

      # Linux users run the script, so ship it too. Strip CR or the shebang
      # breaks when it is run directly.
      - name: Stage the script
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, re
          src = pathlib.Path('vo-patch.py')
          text = src.read_bytes().replace(b'\r\n', b'\n')
          version = re.search(rb'^Version (\S+)', text, re.M).group(1).decode()
          pathlib.Path('dist/vo-patch-%s.py' % version).write_bytes(text)
          print('staged vo-patch-%s.py' % version)
          EOF
          if grep -q $'\r' dist/vo-patch-*.py; then
            echo 'a CR survived - ./vo-patch.py would not run on Linux'
            exit 1
          fi
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: vo-patch-windows
          path: |
            dist/*.exe
            dist/*.py

      # gh is preinstalled on the runner, so no third party action is needed
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.exe dist/*.py --clobber
